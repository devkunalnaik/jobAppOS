services:
  - type: web
    name: job-atlas
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: PORT
        value: 10000
      - key: API_PORT
        value: 10000
      - key: VITE_SUPABASE_URL
        value: https://xadfvcyaluxwmujasory.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SERPAPI_KEY
        sync: false
      - key: ALLOW_LOCAL_MIGRATION
        value: 'false'